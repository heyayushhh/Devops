global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'lab3-monitoring-app'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['lab3-monitoring-app:8000']
