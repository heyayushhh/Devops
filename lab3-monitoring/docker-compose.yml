services:
  lab3-monitoring-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: lab3-monitoring-app:latest
    container_name: lab3-monitoring-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - lab3-monitoring-net

  lab3-prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
    image: lab3-prometheus:latest
    container_name: lab3-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - lab3-monitoring-app
    networks:
      - lab3-monitoring-net

  lab3-grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: lab3-grafana:latest
    container_name: lab3-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - lab3-prometheus
    networks:
      - lab3-monitoring-net

networks:
  lab3-monitoring-net:
    name: lab3-monitoring-net
    driver: bridge
