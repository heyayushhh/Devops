# Lab 3 — Ansible inventory
# Target nodes are local Docker containers (python:3.12-slim / Debian bookworm).
# The controller reaches them through the Docker Engine API using the
# community.docker.docker connection plugin (no SSH required — the controller
# container mounts /var/run/docker.sock).
#
# Per-node variables are consumed by roles/app_config/templates/app.conf.j2.

[lab3_targets]
lab3-ansible-node1 ansible_connection=community.docker.docker app_port=8081 app_env=staging
lab3-ansible-node2 ansible_connection=community.docker.docker app_port=8082 app_env=production
