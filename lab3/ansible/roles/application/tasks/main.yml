---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, docker.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ application_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check out lab configuration
  ansible.builtin.git:
    repo: "{{ application_repository }}"
    dest: "{{ application_dir }}"
    version: "{{ application_version }}"
    force: true
  notify: Start observability stack
